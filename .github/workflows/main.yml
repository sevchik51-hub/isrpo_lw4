name: CI
on: [push]
jobs:
    test:
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            phyton-version: "3.12"
        - run: python -m unittest discover -v
